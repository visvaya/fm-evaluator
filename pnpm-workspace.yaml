allowBuilds:
  '@swc/core': true
  tesseract.js: true

# Refuse to install on a Node.js older than engines.node in package.json (the lowest release
# with the latest security fixes).
engineStrict: true

# With packageManager pinned, pnpm 12 writes its own version as a leading YAML document of
# pnpm-lock.yaml, which GitHub's dependency graph cannot read (no Dependabot alerts).
# "ignore" drops that document; CI still installs the pinned version through
# pnpm/action-setup.
pmOnFail: ignore

# Do not resolve package versions published less than 3 days ago (minutes).
minimumReleaseAge: 4320

# The lint plugins run inside oxlint, which does not need eslint itself. Remove their eslint
# peer so pnpm does not install it (and its dependency tree) just to satisfy the declaration.
overrides:
  'eslint:peer': '-'
  # GHSA-g3hv-75wg-m249 (moderate, development only): fixed only in minimatch 11. eslint-plugin-sonarjs
  # and @typescript-eslint/typescript-estree still ask for ^10. Remove when both accept 11.
  'minimatch@<11.0.1': '^11.0.1'
  # TypeScript 7 ships no compiler API; these packages load it, so they get the official
  # TypeScript 6 compatibility package instead. Remove when they support TypeScript 7.
  'eslint-plugin-sonarjs>typescript': 'npm:@typescript/typescript6@^6.0.2'
  '@typescript-eslint/typescript-estree>typescript:peer': '-'
  '@typescript-eslint/project-service>typescript:peer': '-'
  '@typescript-eslint/tsconfig-utils>typescript:peer': '-'
  'ts-api-utils>typescript:peer': '-'

packageExtensions:
  '@typescript-eslint/typescript-estree':
    dependencies:
      typescript: 'npm:@typescript/typescript6@^6.0.2'
  '@typescript-eslint/project-service':
    dependencies:
      typescript: 'npm:@typescript/typescript6@^6.0.2'
  '@typescript-eslint/tsconfig-utils':
    dependencies:
      typescript: 'npm:@typescript/typescript6@^6.0.2'
  ts-api-utils:
    dependencies:
      typescript: 'npm:@typescript/typescript6@^6.0.2'
