allowBuilds:
  '@swc/core': true
  tesseract.js: true
  unrs-resolver: true

# Refuse to install on a Node.js older than engines.node in package.json (the lowest release
# with the latest security fixes).
engineStrict: true

# With packageManager pinned, pnpm 12 writes its own version as a leading YAML document of
# pnpm-lock.yaml, which GitHub's dependency graph cannot read (no Dependabot alerts).
# "ignore" drops that document; CI still installs the pinned version through
# pnpm/action-setup.
pmOnFail: ignore

# Do not resolve package versions published less than 3 days ago (minutes).
minimumReleaseAge: 4320

overrides:
  # eslint-plugin-boundaries 6.0.2 pins handlebars 4.7.9 (critical advisories, fixed in 4.7.10).
  # Remove together with eslint-plugin-boundaries when the linter moves to oxlint.
  handlebars@4.7.9: 4.7.10
