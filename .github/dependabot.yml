version: 2

# Weekly, grouped updates keep the PR count low on a single-maintainer repo.
# Security updates are not grouped here: they arrive on their own as soon as
# an advisory lands, independent of this schedule. `cooldown` waits a week
# after a version is published before proposing it.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    # ESLint and its plugins are being replaced by oxlint; their updates add findings to code
    # that moves to the new linter. Remove this list together with ESLint. Only version updates
    # are ignored: security updates for these packages still arrive.
    ignore:
      - dependency-name: 'eslint'
        update-types:
          [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: 'eslint-*'
        update-types:
          [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: '@eslint/*'
        update-types:
          [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: 'typescript-eslint'
        update-types:
          [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: '@typescript-eslint/*'
        update-types:
          [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: '@html-eslint/*'
        update-types:
          [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: '@vitest/eslint-plugin'
        update-types:
          [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
    groups:
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Warsaw
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
