name: Feature request
description: An idea for a new feature or a change to an existing one.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The scouting or analysis task, and what makes it hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The change you have in mind, or what a good result would look like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How you do it today
      description: Workarounds or other tools you use for it.
