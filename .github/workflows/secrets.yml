name: Secrets

# Next to GitHub's own secret scanning, gitleaks checks the whole git history
# on every push and pull request, and weekly.
on:
  push:
  pull_request:
  schedule:
    - cron: '0 5 * * 1' # Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not only the pushed commit
          persist-credentials: false
      # Pinned by hand with its checksum from the release's checksums.txt:
      # Dependabot does not bump a binary downloaded in a run step.
      # Downloaded with the job token and retried: anonymous release downloads
      # failed three times during a GitHub incident on 2026-11-08.
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          for attempt in 1 2 3; do
            if gh release download "v${GITLEAKS_VERSION}" --repo gitleaks/gitleaks \
              --pattern "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              --output "$archive" --clobber; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::gitleaks download failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner'
