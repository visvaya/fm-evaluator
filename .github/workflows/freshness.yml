name: Freshness

# Weekly check of the versioned items no dependency bot updates (.github/freshness.json): the Node floor
# against the newest security release of its line, pnpm, and the tools pinned by checksum in workflows.
# Not on pull requests, where an outside release would fail unrelated changes.
on:
  schedule:
    - cron: '0 6 * * 2' # Tuesday 06:00 UTC, after Monday's Dependabot run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshness-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  freshness:
    name: freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Check pinned versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-freshness.mjs
